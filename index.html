<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Teams Generator & Games Played Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 70%;
            box-sizing: border-box;
            margin-right: 5px;
        }
        input[type="number"] {
            padding: 6px;
            width: 60px;
            font-size: 14px;
        }
        select {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 9px 15px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e55c00;
        }
        .accept-btn {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
        }
        .accept-btn:hover {
            background-color: #218838;
        }
        .accept-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .reset-btn {
            background-color: #dc3545;
            padding: 8px 15px;
            font-size: 14px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .remove-all-btn {
            background-color: #dc3545;
            padding: 3px 8px;
            font-size: 12px;
            margin-left: 5px;
        }
        .remove-all-btn:hover {
            background-color: #c82333;
        }
        .top-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            margin-top: 15px;
            gap: 10px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #f9f9fc;
            border-radius: 6px;
            border: 1px solid #e1e1e8;
            flex: 1;
            margin-bottom: 0;
        }
        .roster-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #eef2f7;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-bottom: 15px;
        }
        .player-list-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        .player-list-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .select-all-label {
            font-size: 13px;
            font-weight: normal;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .player-list {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px 0 10px 0;
            border-radius: 4px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid #ccc;
            font-weight: bold;
            color: #444;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }
        .player-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-badge {
            background: #eef2f7;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            font-weight: bold;
        }
        .counter-controls {
            display: flex;
            gap: 3px;
        }
        .counter-btn {
            padding: 2px 6px;
            font-size: 12px;
            background-color: #ddd;
            color: #333;
        }
        .counter-btn:hover {
            background-color: #ccc;
        }
        .teams-container {
            display: flex;
            gap: 20px;
        }
        .team {
            flex: 1;
            background: #eef2f7;
            padding: 15px;
            border-radius: 6px;
        }
        .team ol {
            margin: 0;
            padding-left: 20px;
        }
        .team li {
            margin-bottom: 4px;
        }
        .custom-alert {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }
        .custom-alert button {
            background: transparent;
            color: #856404;
            font-size: 16px;
            padding: 0 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Basketball Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Roster Selector Row -->
        <div class="roster-row">
            <label for="rosterSelect" style="font-weight: bold; color: #333; font-size: 14px;">Select Roster:</label>
            <select id="rosterSelect" onchange="switchRoster()">
                <!-- 1. Custom First -->
                <option value="empty" selected>Custom Roster (Empty)</option>
                
                <!-- 2. Non-empty day-based and compound day-based rosters -->
                <option value="monday">Monday</option>
                <option value="thursday">Thursday</option>
                <option value="thursdayGlenOaks">Thursday Glen Oaks</option>
                <option value="saturday">Saturday</option>
                <option value="sunday">Sunday</option>
                
                <!-- 3. Everything else sorted alphabetically -->
                <option value="stelton">Stelton</option>
            </select>
        </div>

        <!-- Team Size Settings & Reset Button Row -->
        <div class="top-action-row">
            <div class="settings-row">
                <label for="playersPerTeamInput" style="font-weight: bold; color: #444; font-size: 14px;">Players per team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>
            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="newPlayerName" placeholder="Enter player name...">
            <button onclick="addPlayer()">Add Player</button>
        </div>

        <div class="player-list-container">
            <span>Select players available for next game:</span>
            <div class="player-list-controls">
                <label class="select-all-label">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)"> Select All
                </label>
                <button onclick="removeAllPlayers()" class="remove-all-btn">Remove All</button>
                <span id="playerCountDisplay" style="color: #666; font-size: 14px; font-weight: normal; margin-left: 5px;">Available: 0 / 0</span>
            </div>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" style="width: 100%; margin-top: 10px;" id="generateBtnText">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team Black</h3>
                <ol id="teamBlackList"></ol>
            </div>
            <div class="team">
                <h3>Team White</h3>
                <ol id="teamWhiteList"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>
    </div>

        function switchRoster() {
            const selectedRoster = document.getElementById('rosterSelect').value;

        function hideAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function updatePlayerCounts() {
            let total = players.length;
            let availableCount = players.filter(p => p.available).length;
            document.getElementById('playerCountDisplay').textContent = `Available: ${availableCount} / ${total}`;
            
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (total > 0 && availableCount === total) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else if (availableCount === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }

        function renderPlayerList() {
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';

            let headerDiv = document.createElement('div');
            headerDiv.className = 'list-header';
            headerDiv.innerHTML = `<span>Player Name</span><span>Games Played</span>`;
            container.appendChild(headerDiv);

            players.forEach((p, index) => {
                let div = document.createElement('div');
                div.className = 'player-item';

                let leftGroup = document.createElement('div');
                leftGroup.className = 'player-left-group';

                let availableCheckbox = document.createElement('input');
                availableCheckbox.type = 'checkbox';
                availableCheckbox.checked = p.available;
                availableCheckbox.id = 'available_' + index;
                availableCheckbox.onchange = function() { toggleAvailable(index, availableCheckbox.checked); };

                let infoDiv = document.createElement('div');
                infoDiv.className = 'player-info';

                let label = document.createElement('label');
                label.htmlFor = 'available_' + index;
                label.textContent = p.name;
                label.style.cursor = 'pointer';
                if (!p.available) {
                    label.style.color = '#888';
                }

                infoDiv.appendChild(availableCheckbox);
                infoDiv.appendChild(label);
                leftGroup.appendChild(infoDiv);

                let actionsDiv = document.createElement('div');
                actionsDiv.style.display = 'flex';
                actionsDiv.style.alignItems = 'center';
                actionsDiv.style.gap = '8px';

                let badge = document.createElement('span');
                badge.className = 'stats-badge';
                badge.textContent = p.games;

                let counterDiv = document.createElement('div');
                counterDiv.className = 'counter-controls';

                let minusBtn = document.createElement('button');
                minusBtn.textContent = '-';
                minusBtn.className = 'counter-btn';
                minusBtn.onclick = function() { adjustGames(index, -1); };

                let plusBtn = document.createElement('button');
                plusBtn.textContent = '+';
                plusBtn.className = 'counter-btn';
                plusBtn.onclick = function() { adjustGames(index, 1); };

                counterDiv.appendChild(minusBtn);
                counterDiv.appendChild(plusBtn);

                actionsDiv.appendChild(badge);
                actionsDiv.appendChild(counterDiv);

                div.appendChild(leftGroup);
                div.appendChild(actionsDiv);
                container.appendChild(div);
            });

            updatePlayerCounts();
        }

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name !== "") {
                players.push({ name: name, games: 0, available: true });
                input.value = '';
                hideAlert();
                renderPlayerList();
            }
        }

        function removeAllPlayers() {
            players = [];
            lastGameIndices = [];
            pendingTeamBlackIndices = [];
            pendingTeamWhiteIndices = [];
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
        }

        function toggleAvailable(index, isAvailable) {
            players[index].available = isAvailable;
            updatePlayerCounts();
            
            const label = document.querySelector(`label[for="available_${index}"]`);
            if (label) {
                label.style.color = isAvailable ? '#000' : '#888';
            }
        }

        function toggleSelectAll(isChecked) {
            players.forEach(p => {
                p.available = isChecked;
            });
            renderPlayerList();
        }

        function adjustGames(index, amount) {
            players[index].games += amount;
            if (players[index].games < 0) {
                players[index].games = 0;
            }
            renderPlayerList();
        }

        function resetTracker() {
            players.forEach(p => {
                p.games = 0;
                p.available = true;
            });
            lastGameIndices = [];
            pendingTeamBlackIndices = [];
            pendingTeamWhiteIndices = [];
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
        }

        function generateTeams() {
            hideAlert();
            let perTeamInput = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeamInput) || perTeamInput < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            let selectedIndices = [];
            players.forEach((p, index) => {
                if (p.available) {
                    selectedIndices.push(index);
                }
            });

            let requiredTotal = perTeamInput * 2;
            if (selectedIndices.length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeamInput}-player teams!`);
                return;
            }

            selectedIndices.sort((a, b) => {
                let aPlayedLast = lastGameIndices.includes(a) ? 1 : 0;
                let bPlayedLast = lastGameIndices.includes(b) ? 1 : 0;
                if (aPlayedLast !== bPlayedLast) {
                    return aPlayedLast - bPlayedLast;
                }

                return players[a].games - players[b].games;
            });

            let groupedMap = {};
            selectedIndices.forEach(i => {
                let playedLast = lastGameIndices.includes(i) ? 1 : 0;
                let totalGames = players[i].games;
                let key = `${playedLast}_${totalGames}`;

                if (!groupedMap[key]) groupedMap[key] = [];
                groupedMap[key].push(i);
            });

            let prioritizedIndices = [];
            Object.keys(groupedMap).sort().forEach(key => {
                let group = groupedMap[key];
                group.sort(() => Math.random() - 0.5);
                prioritizedIndices.push(...group);
            });

            let totalNeeded = perTeamInput * 2;
            let chosenPlayers = prioritizedIndices.slice(0, totalNeeded);
            chosenPlayers.sort(() => Math.random() - 0.5);

            pendingTeamBlackIndices = chosenPlayers.slice(0, perTeamInput);
            pendingTeamWhiteIndices = chosenPlayers.slice(perTeamInput, totalNeeded);

            const teamBlackList = document.getElementById('teamBlackList');
            const teamWhiteList = document.getElementById('teamWhiteList');
            
            teamBlackList.innerHTML = '';
            teamWhiteList.innerHTML = '';

            pendingTeamBlackIndices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                teamBlackList.appendChild(li);
            });

            pendingTeamWhiteIndices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                teamWhiteList.appendChild(li);
            });

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';
        }

        function acceptLineup() {
            let currentSelectedTeam = [...pendingTeamBlackIndices, ...pendingTeamWhiteIndices];

            players.forEach((p, i) => {
                if (p.available) {
                    if (currentSelectedTeam.includes(i)) {
                        p.games++;
                    }
                }
            });

            lastGameIndices = currentSelectedTeam;
            renderPlayerList();

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Accept Teams & Update Games Played";
        }

        // Enforce dropdown selection sync on load
        document.getElementById('rosterSelect').value = 'empty';
        renderPlayerList();
    </script>

</body>
</html>
