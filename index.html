<html lang="en">

    <title>Teams Generator & Games Played Tracker</title>

            padding: 10px;
            background-color: #f4f4f9;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0;
        }
        input[type="text"] {
            padding: 10px;

            box-sizing: border-box;
            margin-right: 5px;
            font-size: 16px;
        }
        input[type="number"] {
            padding: 8px;
            width: 60px;
            font-size: 16px;
        }
        select {
            padding: 8px 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: white;
            cursor: pointer;
        }
        button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e55c00;
        }
        .accept-btn {
            background-color: #28a745;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            padding: 12px;
        }
        .accept-btn:hover {
            background-color: #218838;
        }
        .accept-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .reset-btn {
            background-color: #dc3545;
            padding: 8px 12px;
            font-size: 14px;
        }
        .reset-btn:hover {
            background-color: #c82333;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #eef2f7;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            margin-bottom: 15px;
            gap: 10px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-list-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .player-list {
            border: 1px solid #ddd;
            padding: 8px;
            margin: 5px 0 10px 0;
            border-radius: 4px;
        }
        .player-rows {
            max-height: 400px;
            overflow-y: auto;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 2px solid #ccc;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        .header-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .header-center-group {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 1;
        }
        .header-right-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex: 1;
        }
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;

            align-items: center;
            gap: 10px;
            flex: 1;
        }

            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            flex: 1;
        }

            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex: 1;
        }
        .player-info {

            align-items: center;
            gap: 8px;
        }

        }
        .checkin-time {

            font-size: 14px;
            color: #333;

            background-color: #ddd;

</head>
<body>

    <div class="card">
        <h2>Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Combined Top Control Row -->
        <div class="control-row">
            <div class="control-group">
                <label for="rosterSelect" style="font-weight: bold; color: #333; font-size: 14px;">Roster:</label>
                <select id="rosterSelect" onchange="switchRoster()">
                    <option value="empty" selected>Custom (Empty)</option>
                    <option value="monday">Monday</option>
                    <option value="thursday">Thursday</option>
                    <option value="thursdayGlenOaks">Thursday Glen Oaks</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                    <option value="stelton">Stelton</option>
                </select>
            </div>

            <div class="control-group">
                <label for="playersPerTeamInput" style="font-weight: bold; color: #444; font-size: 14px;">Players/team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>

            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="newPlayerName" placeholder="Enter player name..." style="flex: 1; margin-right: 0;">
            <button onclick="addPlayer()">Add</button>
        </div>

        <div class="player-list-container">
            <span>Available players:</span>
            <span id="playerCountDisplay" style="color: #666; font-size: 14px; font-weight: normal;"><b>Available:</b> 0 / 0</span>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" style="width: 100%; margin-top: 10px; padding: 12px;" id="generateBtnText">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team 1</h3>
                <ol id="team1List"></ol>
            </div>
            <div class="team">
                <h3>Team 2</h3>
                <ol id="team2List"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>
    </div>

    <!-- Games Played History -->

        let players = empty.map(p => ({ ...p }));
        let pendingTeam1Indices = [];

        function saveToLocalStorage() {
            const currentRoster = document.getElementById('rosterSelect').value;
            const state = {
                roster: currentRoster,
                players: players,
                gamesHistory: gamesHistory,
                lastGameIndices: lastGameIndices
            };
            localStorage.setItem('teams_tracker_state_' + currentRoster, JSON.stringify(state));
            localStorage.setItem('teams_tracker_last_roster', currentRoster);
        }

        function loadFromLocalStorage(rosterKey) {
            const savedState = localStorage.getItem('teams_tracker_state_' + rosterKey);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    players = (parsed.players || []).map(p => ({
                        ...p,
                        checkedIn: p.checkedIn || false,
                        checkInTime: p.checkInTime || null
                    }));
                    gamesHistory = parsed.gamesHistory || [];
                    lastGameIndices = parsed.lastGameIndices || [];
                    return true;
                } catch (e) {
                    console.error("Failed to parse stored state:", e);
                }
            }
            return false;
        }

        function switchRoster() {
            const selectedRoster = document.getElementById('rosterSelect').value;
            let loaded = loadFromLocalStorage(selectedRoster);

            if (!loaded) {
                let sourceList = empty;
                if (selectedRoster === 'monday') sourceList = monday;
                if (selectedRoster === 'thursday') sourceList = thursday;
                if (selectedRoster === 'thursdayGlenOaks') sourceList = thursdayGlenOaks;
                if (selectedRoster === 'saturday') sourceList = saturday;
                if (selectedRoster === 'sunday') sourceList = sunday;
                if (selectedRoster === 'stelton') sourceList = stelton;
                
                players = sourceList.map(p => ({ ...p, available: false, checkedIn: false, checkInTime: null }));
                lastGameIndices = [];
                gamesHistory = [];
            }

            pendingTeam1Indices = [];
            pendingTeam2Indices = [];
            
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('outputCard').style.display = 'none';
            
            hideAlert();
            renderPlayerList();
            renderHistory();
            saveToLocalStorage();

            const container = document.getElementById('playerContainer');
            if (container) {
                container.scrollTop = 0;
            }
        }

        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            const alertMsg = document.getElementById('customAlertMsg');
            alertMsg.textContent = message;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        function updatePlayerCounts() {
            let total = players.length;
            let availableCount = players.filter(p => p.available).length;
            document.getElementById('playerCountDisplay').innerHTML = `<b>Available:</b> ${availableCount} / ${total}`;
        }

        function renderPlayerList() {
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';

            let headerDiv = document.createElement('div');
            headerDiv.className = 'list-header';

            let headerLeftGroup = document.createElement('div');
            headerLeftGroup.className = 'header-left-group';
            let headerLabel = document.createElement('span');
            headerLabel.textContent = "Player Name";
            headerLeftGroup.appendChild(headerLabel);

            let headerCenterGroup = document.createElement('div');
            headerCenterGroup.className = 'header-center-group';
            let checkedInLabel = document.createElement('span');
            checkedInLabel.textContent = "Checked In";
            headerCenterGroup.appendChild(checkedInLabel);

            let headerRightGroup = document.createElement('div');
            headerRightGroup.className = 'header-right-group';
            let gamesPlayedSpan = document.createElement('span');
            gamesPlayedSpan.textContent = "Games Played";
            headerRightGroup.appendChild(gamesPlayedSpan);

            headerDiv.appendChild(headerLeftGroup);
            headerDiv.appendChild(headerCenterGroup);
            headerDiv.appendChild(headerRightGroup);
            container.appendChild(headerDiv);

            // Scrollable wrapper for just the player rows, so the header above stays fixed
            let rowsContainer = document.createElement('div');
            rowsContainer.className = 'player-rows';
            container.appendChild(rowsContainer);

            players.forEach((p, index) => {
                let div = document.createElement('div');
                div.className = 'player-item';

                // Left Column: Available & Player Name
                let leftGroup = document.createElement('div');
                leftGroup.className = 'player-left-group';

                let availableCheckbox = document.createElement('input');
                availableCheckbox.type = 'checkbox';
                availableCheckbox.checked = p.available;
                availableCheckbox.id = 'available_' + index;
                availableCheckbox.onchange = function() { toggleAvailable(index, availableCheckbox.checked); };

                let infoDiv = document.createElement('div');

                let label = document.createElement('label');
                label.htmlFor = 'available_' + index;
                label.textContent = p.name;

                    label.style.color = '#888';
                }

                infoDiv.appendChild(availableCheckbox);
                infoDiv.appendChild(label);
                leftGroup.appendChild(infoDiv);

                // Center Column: Left-aligned Check-In + Timestamp
                let centerGroup = document.createElement('div');

                let checkedInCheckbox = document.createElement('input');
                checkedInCheckbox.type = 'checkbox';
                checkedInCheckbox.checked = p.checkedIn || false;
                checkedInCheckbox.id = 'checkedIn_' + index;

                centerGroup.appendChild(checkedInCheckbox);

                if (p.checkedIn && p.checkInTime) {
                    let timeSpan = document.createElement('span');
                    timeSpan.className = 'checkin-time';

                    centerGroup.appendChild(timeSpan);

                // Right Column: Games Played Counters
                let rightGroup = document.createElement('div');

                let actionsDiv = document.createElement('div');
                actionsDiv.style.display = 'flex';
                actionsDiv.style.alignItems = 'center';
                actionsDiv.style.gap = '8px';

                let badge = document.createElement('span');
                badge.className = 'stats-badge';
                badge.textContent = p.games;

                let counterDiv = document.createElement('div');

                let minusBtn = document.createElement('button');
                minusBtn.textContent = '-';
                minusBtn.className = 'counter-btn';
                minusBtn.onclick = function() { adjustGames(index, -1); };

                let plusBtn = document.createElement('button');
                plusBtn.textContent = '+';
                plusBtn.className = 'counter-btn';
                plusBtn.onclick = function() { adjustGames(index, 1); };

                counterDiv.appendChild(minusBtn);
                counterDiv.appendChild(plusBtn);

                actionsDiv.appendChild(badge);
                actionsDiv.appendChild(counterDiv);
                rightGroup.appendChild(actionsDiv);

                div.appendChild(leftGroup);
                div.appendChild(centerGroup);
                div.appendChild(rightGroup);
                rowsContainer.appendChild(div);

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name !== "") {
                players.push({ name: name, games: 0, available: false, checkedIn: false, checkInTime: null });
                players.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'accent' }));
                input.value = '';
                hideAlert();
                renderPlayerList();
                saveToLocalStorage();
            }
        }

        function toggleAvailable(index, isAvailable) {
            players[index].available = isAvailable;

            // If marking available and they aren't checked in yet, auto check them in
            if (isAvailable && !players[index].checkedIn) {
                toggleCheckedIn(index, true);
                return; // toggleCheckedIn() already re-renders and saves
            }

            updatePlayerCounts();

            const label = document.querySelector(`label[for="available_${index}"]`);
            if (label) {
                label.style.color = isAvailable ? '#000' : '#888';
            }
            saveToLocalStorage();
        }

        function toggleCheckedIn(index, isCheckedIn) {
            if (isCheckedIn) {
                // Calculate current average games played across all checked-in players
                const checkedInPlayers = players.filter(p => p.checkedIn);
                if (checkedInPlayers.length > 0) {
                    const totalGames = checkedInPlayers.reduce((sum, p) => sum + p.games, 0);
                    const avgGames = Math.floor(totalGames / checkedInPlayers.length);
                    
                    // Set player's games to floor average if checking in for the first time (games == 0)
                    if (players[index].games === 0) {
                        players[index].games = avgGames;
                    }
                }

                players[index].checkedIn = true;
                players[index].available = true;
                players[index].checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                players[index].checkedIn = false;
                players[index].available = false;
                players[index].checkInTime = null;
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function adjustGames(index, amount) {
            players[index].games += amount;
            if (players[index].games < 0) {
                players[index].games = 0;
            }
            renderPlayerList();
            saveToLocalStorage();
        }

        function resetTracker() {
            const currentRoster = document.getElementById('rosterSelect').value;
            localStorage.removeItem('teams_tracker_state_' + currentRoster);

            let sourceList = empty;
            if (currentRoster === 'monday') sourceList = monday;
            if (currentRoster === 'thursday') sourceList = thursday;
            if (currentRoster === 'thursdayGlenOaks') sourceList = thursdayGlenOaks;
            if (currentRoster === 'saturday') sourceList = saturday;
            if (currentRoster === 'sunday') sourceList = sunday;
            if (currentRoster === 'stelton') sourceList = stelton;

            players = sourceList.map(p => ({ ...p, available: false, checkedIn: false, checkInTime: null }));
            lastGameIndices = [];
            pendingTeam1Indices = [];
            pendingTeam2Indices = [];
            gamesHistory = [];
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('outputCard').style.display = 'none';
            document.getElementById('historyCard').style.display = 'none';
            document.getElementById('historyContainer').innerHTML = '';
            hideAlert();
            renderPlayerList();

            const container = document.getElementById('playerContainer');
            if (container) {
                container.scrollTop = 0;
            }
        }

        function generateTeams() {
            hideAlert();
    
            // 1. Read input configuration
            let perTeamInput = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeamInput) || perTeamInput < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            // 2. Filter for available players
            let selectedIndices = [];
            players.forEach((p, index) => {
                if (p.available) {
                    selectedIndices.push(index);
                }
            });

            let requiredTotal = perTeamInput * 2;
            if (selectedIndices.length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeamInput}-player teams!`);
                return;
            }

            /**
             * Streak Score Helper:
             * - Returns a NEGATIVE number for consecutive games SAT OUT (e.g., -2 = sat out 2 straight games).
             * - Returns a POSITIVE number for consecutive games PLAYED (e.g., +2 = played 2 straight games).
             * - Returns 0 if no games have been recorded yet.
             */
            function getStreakScore(playerIndex) {
                let playerName = players[playerIndex].name;
                if (gamesHistory.length === 0) return 0;

                // Check last game played state
                let lastGame = gamesHistory[gamesHistory.length - 1];
                let playedLast = lastGame.team1.includes(playerName) || lastGame.team2.includes(playerName);

                let streak = 0;
                for (let i = gamesHistory.length - 1; i >= 0; i--) {
                    let game = gamesHistory[i];
                    let playedInGame = game.team1.includes(playerName) || game.team2.includes(playerName);

                    if (playedInGame === playedLast) {
                        streak++;
                    } else {
                        break;
                    }
                }

                return playedLast ? streak : -streak;
            }

            // 3. Group players by their exact streak score
            let groupedMap = {};
            selectedIndices.forEach(i => {
                let score = getStreakScore(i);
                if (!groupedMap[score]) groupedMap[score] = [];
                groupedMap[score].push(i);
            });

            // 4. Sort groups ascending (most negative scores first = highest priority)
            let prioritizedIndices = [];
            Object.keys(groupedMap)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(score => {
                    let group = groupedMap[score];
                    // Randomize ties within the same streak tier
                    group.sort(() => Math.random() - 0.5);
                    prioritizedIndices.push(...group);
                });

            // 5. Select the top required players and split into teams
            let totalNeeded = perTeamInput * 2;
            let chosenPlayers = prioritizedIndices.slice(0, totalNeeded);
    
            // Randomly divide chosen players between Team 1 and Team 2
            chosenPlayers.sort(() => Math.random() - 0.5);

            pendingTeam1Indices = chosenPlayers.slice(0, perTeamInput);
            pendingTeam2Indices = chosenPlayers.slice(perTeamInput, totalNeeded);

            // Sort players alphabetically for visual presentation
            pendingTeam1Indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));
            pendingTeam2Indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));

            // 6. Update UI
            const team1List = document.getElementById('team1List');
            const team2List = document.getElementById('team2List');
    
            team1List.innerHTML = '';
            team2List.innerHTML = '';

            pendingTeam1Indices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                team1List.appendChild(li);
            });

            pendingTeam2Indices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                team2List.appendChild(li);
            });

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';
        }

        function acceptLineup() {
            let currentSelectedTeam = [...pendingTeam1Indices, ...pendingTeam2Indices];

            players.forEach((p, i) => {
                if (p.available) {
                    if (currentSelectedTeam.includes(i)) {
                        p.games++;
                    }
                }
            });

            lastGameIndices = currentSelectedTeam;
            renderPlayerList();

            // Add to games history with current date and time timestamp
            let team1Names = pendingTeam1Indices.map(i => players[i].name);
            let team2Names = pendingTeam2Indices.map(i => players[i].name);
            let timestamp = new Date().toLocaleString();
            gamesHistory.push({ team1: team1Names, team2: team2Names, timestamp: timestamp });
            renderHistory();
            saveToLocalStorage();

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Accept Teams & Update Games Played";
        }

        function deleteGame(historyIndex) {
            let game = gamesHistory[historyIndex];
            
            // Decrement game count for players who were in this game entry
            let allPlayerNames = [...game.team1, ...game.team2];
            allPlayerNames.forEach(name => {
                let player = players.find(p => p.name === name);
                if (player && player.games > 0) {
                    player.games--;
                }
            });

            // Remove game entry from history
            gamesHistory.splice(historyIndex, 1);

            // Update lastGameIndices to reflect previous game or clear if empty
            if (gamesHistory.length > 0) {
                let lastGame = gamesHistory[gamesHistory.length - 1];
                let lastGameNames = [...lastGame.team1, ...lastGame.team2];
                lastGameIndices = players
                    .map((p, idx) => lastGameNames.includes(p.name) ? idx : -1)
                    .filter(idx => idx !== -1);
            } else {
                lastGameIndices = [];
            }

            renderPlayerList();
            renderHistory();
            saveToLocalStorage();
        }

        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const historyCard = document.getElementById('historyCard');
            historyContainer.innerHTML = '';

            if (gamesHistory.length === 0) {
                historyCard.style.display = 'none';
                return;
            }

            historyCard.style.display = 'block';

            gamesHistory.forEach((game, index) => {
                let gameDiv = document.createElement('div');
                gameDiv.className = 'history-item';

                let headerDiv = document.createElement('div');
                headerDiv.className = 'history-item-header';

                let title = document.createElement('h4');
                title.textContent = `Game ${index + 1}`;

                let headerRight = document.createElement('div');
                headerRight.style.display = 'flex';
                headerRight.style.alignItems = 'center';
                headerRight.style.gap = '10px';

                let timeSpan = document.createElement('span');
                timeSpan.className = 'history-timestamp';
                timeSpan.textContent = game.timestamp;

                let deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = function() { deleteGame(index); };

                headerRight.appendChild(timeSpan);
                headerRight.appendChild(deleteBtn);

                headerDiv.appendChild(title);
                headerDiv.appendChild(headerRight);
                gameDiv.appendChild(headerDiv);

                let teamsContainer = document.createElement('div');
                teamsContainer.className = 'teams-container';

                let team1Div = document.createElement('div');
                team1Div.className = 'team';
                let t1Heading = document.createElement('h3');
                t1Heading.textContent = 'Team 1';
                let t1Ol = document.createElement('ol');
                game.team1.forEach(name => {
                    let li = document.createElement('li');
                    li.textContent = name;
                    t1Ol.appendChild(li);
                });
                team1Div.appendChild(t1Heading);
                team1Div.appendChild(t1Ol);

                let team2Div = document.createElement('div');
                team2Div.className = 'team';
                let t2Heading = document.createElement('h3');
                t2Heading.textContent = 'Team 2';
                let t2Ol = document.createElement('ol');
                game.team2.forEach(name => {
                    let li = document.createElement('li');
                    li.textContent = name;
                    t2Ol.appendChild(li);
                });
                team2Div.appendChild(t2Heading);
                team2Div.appendChild(t2Ol);

                teamsContainer.appendChild(team1Div);
                teamsContainer.appendChild(team2Div);
                gameDiv.appendChild(teamsContainer);

                historyContainer.appendChild(gameDiv);
            });
        }

        // Initialize state on page load
        const lastRoster = localStorage.getItem('teams_tracker_last_roster') || 'empty';
        document.getElementById('rosterSelect').value = lastRoster;
        switchRoster();
    </script>
