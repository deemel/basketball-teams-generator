    <div class="card">
        <h2><img src="favicon-192.png" alt="" class="header-icon">Teams Generator & Games Played Tracker</h2>

        <!-- Custom Inline Message Banner -->
        <div id="customAlert" class="custom-alert">
            <span id="customAlertMsg"></span>
            <button onclick="hideAlert()">&times;</button>
        </div>

        <!-- Combined Top Control Row -->
        <div class="control-row">
            <div class="control-group">
                <label for="rosterSelect" style="font-weight: bold; color: #333; font-size: 14px;">Roster:</label>
                <select id="rosterSelect" onchange="switchRoster()">
                    <option value="empty" selected>Custom (Empty)</option>
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="thursdayGlenOaks">Thursday Glen Oaks</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                    <option value="stelton">Stelton</option>
                </select>
            </div>

            <div class="control-group">
                <label for="playersPerTeamInput" style="font-weight: bold; color: #444; font-size: 14px;">Players/team:</label>
                <input type="number" id="playersPerTeamInput" value="5" min="1" max="15">
            </div>

            <button onclick="resetTracker()" class="reset-btn">Reset</button>
        </div>
        
        <!-- Add Player Form -->
        <div style="margin-bottom: 15px; display: flex; gap: 5px;">
            <input type="text" id="newPlayerName" placeholder="Enter player name..." maxlength="16" style="flex: 1; margin-right: 0;">
            <button onclick="addPlayer()">Add</button>
        </div>

        <div class="player-list-container">
            <span>Available players:</span>
            <span id="playerCountDisplay" style="color: #666; font-size: 14px; font-weight: normal;"><b>Available:</b> 0 / 0</span>
        </div>
        
        <!-- Dynamic Checkboxes Container -->
        <div id="playerContainer" class="player-list"></div>

        <button onclick="generateTeams()" style="width: 100%; margin-top: 10px; padding: 12px;" id="generateBtnText">Generate Teams Preview</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
        <h2>Teams Preview</h2>
        <div class="teams-container">
            <div class="team">
                <h3>Team 1</h3>
                <ol id="team1List"></ol>
            </div>
            <div class="team">
                <h3>Team 2</h3>
                <ol id="team2List"></ol>
            </div>
        </div>
        <!-- Accept Teams Button -->
        <button id="acceptBtn" class="accept-btn" onclick="acceptLineup()">Accept Teams & Update Games Played</button>

        <!-- Copy Teams Button -->
        <button id="copyTeamsBtn" class="copy-btn" onclick="copyTeamsToClipboard()">Copy Teams as Text</button>
    </div>

    <!-- Games Played History -->
    <div class="card" id="historyCard" style="display:none;">
        <h2>Games Played History</h2>
        <div id="historyContainer"></div>
    </div>

        function saveToLocalStorage() {
            const currentRoster = document.getElementById('rosterSelect').value;

                players: players,
                gamesHistory: gamesHistory,
                lastGameIndices: lastGameIndices

        }

        function loadFromLocalStorage(rosterKey) {
            const savedState = localStorage.getItem('teams_tracker_state_' + rosterKey);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    players = (parsed.players || []).map(p => {
                        // Migrate legacy "games" key to "gamesPlayed" for data saved before this rename
                        let migratedGamesPlayed = (p.gamesPlayed !== undefined) ? p.gamesPlayed : (p.games || 0);
                        return {
                            name: p.name,
                            gamesPlayed: migratedGamesPlayed,
                            available: p.available || false,
                            checkedIn: p.checkedIn || false,
                            checkInTime: p.checkInTime || null,
                            gamesOffset: (p.gamesOffset === undefined) ? null : p.gamesOffset
                        };
                    });
                    gamesHistory = parsed.gamesHistory || [];
                    lastGameIndices = parsed.lastGameIndices || [];
                    return true;
                } catch (e) {
                    console.error("Failed to parse stored state:", e);
                }
            }
            return false;
        }

        /**
         * Effective Games Played: a player's raw gamesPlayed plus their gamesOffset
         * (the average effective games they were credited with at check-in). Used as
         * the fairness basis for both the check-in average calculation and team generation.
         */
        function getEffectiveGamesPlayed(player) {
            let offset = (player.gamesOffset === null || player.gamesOffset === undefined) ? 0 : player.gamesOffset;
            return player.gamesPlayed + offset;
        }

        /**
         * Parses a 12-hour time string like "03:45 PM" (as produced by
         * toLocaleTimeString with hour/minute '2-digit') into minutes since
         * midnight, for correct numeric time-of-day comparisons. Returns null
         * if the string is missing or doesn't match the expected format.
         */
        function parseCheckInTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            let match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!match) return null;

            let hour = parseInt(match[1], 10);
            let minute = parseInt(match[2], 10);
            let period = match[3].toUpperCase();

            if (period === 'AM') {
                if (hour === 12) hour = 0;
            } else {
                if (hour !== 12) hour += 12;
            }

            return hour * 60 + minute;
        }

        function setSortColumn(column) {
            if (sortColumn === column) {
                sortDirection = (sortDirection === 'asc') ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                // Sensible default per column: names read naturally A-Z,
                // everything else (checkboxes/numbers) reads naturally highest/most-recent-first
                sortDirection = (column === 'name') ? 'asc' : 'desc';
            }
            renderPlayerList();
        }

        function getSortedPlayerIndices() {
            let indices = players.map((_, idx) => idx);

            if (sortColumn === 'name') {
                indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));
            } else if (sortColumn === 'checkedIn') {
                indices.sort((a, b) => {
                    let minutesA = parseCheckInTimeToMinutes(players[a].checkInTime);
                    let minutesB = parseCheckInTimeToMinutes(players[b].checkInTime);
                    if (minutesA === null) minutesA = -1;
                    if (minutesB === null) minutesB = -1;
                    if (minutesA !== minutesB) {
                        return minutesA - minutesB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction. Since the whole array gets reversed below when
                    // sortDirection is 'desc', negate the comparison here so it
                    // lands back in A→Z order after that reversal.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return sortDirection === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (sortColumn === 'gamesOffset') {
                indices.sort((a, b) => {
                    let offsetA = (players[a].gamesOffset === null || players[a].gamesOffset === undefined) ? -1 : players[a].gamesOffset;
                    let offsetB = (players[b].gamesOffset === null || players[b].gamesOffset === undefined) ? -1 : players[b].gamesOffset;
                    if (offsetA !== offsetB) {
                        return offsetA - offsetB;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn branch above.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return sortDirection === 'desc' ? -nameCompare : nameCompare;
                });
            } else if (sortColumn === 'gamesPlayed') {
                indices.sort((a, b) => {
                    if (players[a].gamesPlayed !== players[b].gamesPlayed) {
                        return players[a].gamesPlayed - players[b].gamesPlayed;
                    }
                    // Name tiebreaker always reads A→Z regardless of column
                    // sort direction — see the same pattern in the checkedIn and
                    // gamesOffset branches above.
                    let nameCompare = players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' });
                    return sortDirection === 'desc' ? -nameCompare : nameCompare;
                });
            }

            if (sortDirection === 'desc') {
                indices.reverse();
            }

            return indices;
        }

            span.textContent = text + arrow;
            return span;

        function toggleSelectAllAvailable(isChecked) {
            if (isChecked) {
                players.forEach((p) => {
                    if (!p.checkedIn) {
                        // Same logic as toggleCheckedIn(): base the offset on the average
                        // effective games played of everyone already checked in so far.
                        const checkedInPlayers = players.filter(pl => pl.checkedIn);
                        const avgGames = checkedInPlayers.length > 0
                            ? Math.floor(checkedInPlayers.reduce((sum, pl) => sum + getEffectiveGamesPlayed(pl), 0) / checkedInPlayers.length)
                            : 0;

                        p.gamesOffset = avgGames;
                        p.checkedIn = true;
                        p.checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                    p.available = true;
                });
            } else {
                players.forEach((p) => {
                    p.available = false;
                });
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function addPlayer() {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if (name === "") {
                return;
            }
            if (name.length > 16) {
                showAlert("Player name must be 16 characters or fewer.");
                return;
            }
            const isDuplicate = players.some(p => p.name.localeCompare(name, 'en', { sensitivity: 'accent' }) === 0);
            if (isDuplicate) {
                showAlert(`"${name}" is already on this roster.`);
                return;
            }
            players.push({ name: name, gamesPlayed: 0, available: false, checkedIn: false, checkInTime: null, gamesOffset: null });
            players.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'accent' }));
            input.value = '';
            hideAlert();
            renderPlayerList();
            saveToLocalStorage();
        }

        function toggleAvailable(index, isAvailable) {
            players[index].available = isAvailable;

            // If marking available and they aren't checked in yet, auto check them in
            if (isAvailable && !players[index].checkedIn) {
                toggleCheckedIn(index, true);
                return; // toggleCheckedIn() already re-renders and saves
            }

            updatePlayerCounts();

            const label = document.querySelector(`label[for="available_${index}"]`);
            if (label) {
                label.style.color = isAvailable ? '#000' : '#888';
            }
            saveToLocalStorage();
        }

        function toggleCheckedIn(index, isCheckedIn) {
            if (isCheckedIn) {
                // Calculate current average EFFECTIVE games played (gamesPlayed + gamesOffset)
                // across all already checked-in players
                const checkedInPlayers = players.filter(p => p.checkedIn);
                const avgGames = checkedInPlayers.length > 0
                    ? Math.floor(checkedInPlayers.reduce((sum, p) => sum + getEffectiveGamesPlayed(p), 0) / checkedInPlayers.length)
                    : 0;

                // Record this check-in's games offset snapshot (used as a fairness input during team generation)
                players[index].gamesOffset = avgGames;

                players[index].checkedIn = true;
                players[index].available = true;
                players[index].checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                players[index].checkedIn = false;
                players[index].available = false;
                players[index].checkInTime = null;
            }

            renderPlayerList();
            saveToLocalStorage();
        }

        function adjustGames(index, amount) {
            players[index].gamesPlayed += amount;
            if (players[index].gamesPlayed < 0) {
                players[index].gamesPlayed = 0;
            }
            renderPlayerList();
            saveToLocalStorage();
        }

        function resetTracker() {
            const currentRoster = document.getElementById('rosterSelect').value;
            localStorage.removeItem('teams_tracker_state_' + currentRoster);

            let sourceList = empty;
            if (currentRoster === 'monday') sourceList = monday;
            if (currentRoster === 'tuesday') sourceList = tuesday;
            if (currentRoster === 'thursday') sourceList = thursday;
            if (currentRoster === 'thursdayGlenOaks') sourceList = thursdayGlenOaks;
            if (currentRoster === 'saturday') sourceList = saturday;
            if (currentRoster === 'sunday') sourceList = sunday;
            if (currentRoster === 'stelton') sourceList = stelton;

            players = sourceList.map(p => ({ ...p, available: false, checkedIn: false, checkInTime: null, gamesOffset: null }));
            lastGameIndices = [];
            pendingTeam1Indices = [];
            pendingTeam2Indices = [];
            gamesHistory = [];
            document.getElementById('playersPerTeamInput').value = 5;
            document.getElementById('newPlayerName').value = '';
            document.getElementById('outputCard').style.display = 'none';
            hideAlert();
            renderPlayerList();
            renderHistory();
            saveToLocalStorage();

            const rowsContainer = document.querySelector('#playerContainer .player-rows');
            if (rowsContainer) {
                rowsContainer.scrollTop = 0;
            }
        }

        function generateTeams() {
            hideAlert();
    
            // 1. Read input configuration
            let perTeamInput = parseInt(document.getElementById('playersPerTeamInput').value);
            if (isNaN(perTeamInput) || perTeamInput < 1) {
                showAlert("Please enter a valid number of players per team!");
                return;
            }

            // 2. Filter for available players
            let selectedIndices = [];
            players.forEach((p, index) => {
                if (p.available) {
                    selectedIndices.push(index);
                }
            });

            let requiredTotal = perTeamInput * 2;
            if (selectedIndices.length < requiredTotal) {
                showAlert(`Please select at least ${requiredTotal} available players to form two ${perTeamInput}-player teams!`);
                return;
            }

            /**
             * Streak Score Helper:
             * - Returns a NEGATIVE number for consecutive games SAT OUT (e.g., -2 = sat out 2 straight games).
             * - Returns a POSITIVE number for consecutive games PLAYED (e.g., +2 = played 2 straight games).
             * - Returns 0 if no games have been recorded yet.
             */
            function getStreakScore(playerIndex) {
                let playerName = players[playerIndex].name;
                if (gamesHistory.length === 0) return 0;

                // Check last game played state
                let lastGame = gamesHistory[gamesHistory.length - 1];
                let playedLast = lastGame.team1.includes(playerName) || lastGame.team2.includes(playerName);

                let streak = 0;
                for (let i = gamesHistory.length - 1; i >= 0; i--) {
                    let game = gamesHistory[i];
                    let playedInGame = game.team1.includes(playerName) || game.team2.includes(playerName);

                    if (playedInGame === playedLast) {
                        streak++;
                    } else {
                        break;
                    }
                }

                return playedLast ? streak : -streak;
            }

            // 3. Group players by their exact streak score
            let groupedMap = {};
            selectedIndices.forEach(i => {
                let score = getStreakScore(i);
                if (!groupedMap[score]) groupedMap[score] = [];
                groupedMap[score].push(i);
            });

            // 4. Sort groups ascending (most negative scores first = highest priority)
            let prioritizedIndices = [];
            Object.keys(groupedMap)
                .map(Number)
                .sort((a, b) => a - b)
                .forEach(score => {
                    let group = groupedMap[score];

                    // Pre-shuffle so any exact ties in effective games played land in random order
                    group.sort(() => Math.random() - 0.5);

                    // Within each streak tier, prioritize players with fewer effective games played
                    // (gamesPlayed + gamesOffset) — sort() is stable, so the random pre-shuffle
                    // above still governs exact ties
                    group.sort((a, b) => getEffectiveGamesPlayed(players[a]) - getEffectiveGamesPlayed(players[b]));

                    prioritizedIndices.push(...group);
                });

            // 5. Select the top required players and split into teams
            let totalNeeded = perTeamInput * 2;
            let chosenPlayers = prioritizedIndices.slice(0, totalNeeded);
    
            // Randomly divide chosen players between Team 1 and Team 2
            chosenPlayers.sort(() => Math.random() - 0.5);

            pendingTeam1Indices = chosenPlayers.slice(0, perTeamInput);
            pendingTeam2Indices = chosenPlayers.slice(perTeamInput, totalNeeded);

            // Sort players alphabetically for visual presentation
            pendingTeam1Indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));
            pendingTeam2Indices.sort((a, b) => players[a].name.localeCompare(players[b].name, 'en', { sensitivity: 'accent' }));

            // 6. Update UI
            const team1List = document.getElementById('team1List');
            const team2List = document.getElementById('team2List');
    
            team1List.innerHTML = '';
            team2List.innerHTML = '';

            pendingTeam1Indices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                team1List.appendChild(li);
            });

            pendingTeam2Indices.forEach(i => {
                let li = document.createElement('li');
                li.textContent = players[i].name;
                team2List.appendChild(li);
            });

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = false;
            acceptBtn.textContent = "Accept Teams & Update Games Played";

            document.getElementById('outputCard').style.display = 'block';
        }

        function copyTeamsToClipboard() {
            if (pendingTeam1Indices.length === 0 && pendingTeam2Indices.length === 0) {
                showAlert("Generate teams first before copying.");
                return;
            }

            let lines = [];
            lines.push("Team 1:");
            pendingTeam1Indices.forEach((i, idx) => {
                lines.push(`${idx + 1}. ${players[i].name}`);
            });
            lines.push("");
            lines.push("Team 2:");
            pendingTeam2Indices.forEach((i, idx) => {
                lines.push(`${idx + 1}. ${players[i].name}`);
            });

            let teamsText = lines.join("\n");

            const copyBtn = document.getElementById('copyTeamsBtn');
            const originalText = copyBtn ? copyBtn.textContent : null;

            function showCopiedFeedback() {
                if (copyBtn) {
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                }
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(teamsText).then(showCopiedFeedback).catch(() => {
                    fallbackCopyText(teamsText, showCopiedFeedback);
                });
            } else {
                fallbackCopyText(teamsText, showCopiedFeedback);
            }
        }

        function fallbackCopyText(text, onSuccess) {
            let textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                if (onSuccess) onSuccess();
            } catch (e) {
                showAlert("Unable to copy teams. Please copy manually.");
            }
            document.body.removeChild(textarea);
        }

        function acceptLineup() {
            let currentSelectedTeam = [...pendingTeam1Indices, ...pendingTeam2Indices];

            players.forEach((p, i) => {
                if (p.available) {
                    if (currentSelectedTeam.includes(i)) {
                        p.gamesPlayed++;
                    }
                }
            });

            lastGameIndices = currentSelectedTeam;
            renderPlayerList();

            // Add to games history with current date and time timestamp
            let team1Names = pendingTeam1Indices.map(i => players[i].name);
            let team2Names = pendingTeam2Indices.map(i => players[i].name);
            let timestamp = new Date().toLocaleString();
            gamesHistory.push({ team1: team1Names, team2: team2Names, timestamp: timestamp });
            renderHistory();
            saveToLocalStorage();

            const acceptBtn = document.getElementById('acceptBtn');
            acceptBtn.disabled = true;
            acceptBtn.textContent = "Accept Teams & Update Games Played";
        }

        function deleteGame(historyIndex) {
            let game = gamesHistory[historyIndex];
            
            // Decrement games played count for players who were in this game entry
            let allPlayerNames = [...game.team1, ...game.team2];
            allPlayerNames.forEach(name => {
                let player = players.find(p => p.name === name);
                if (player && player.gamesPlayed > 0) {
                    player.gamesPlayed--;
                }
            });

            // Remove game entry from history
            gamesHistory.splice(historyIndex, 1);

            // Update lastGameIndices to reflect previous game or clear if empty
            if (gamesHistory.length > 0) {
                let lastGame = gamesHistory[gamesHistory.length - 1];
                let lastGameNames = [...lastGame.team1, ...lastGame.team2];
                lastGameIndices = players
                    .map((p, idx) => lastGameNames.includes(p.name) ? idx : -1)
                    .filter(idx => idx !== -1);
            } else {
                lastGameIndices = [];
            }

            renderPlayerList();
            renderHistory();
            saveToLocalStorage();
        }

        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const historyCard = document.getElementById('historyCard');
            historyContainer.innerHTML = '';

            if (gamesHistory.length === 0) {
                historyCard.style.display = 'none';
                return;
            }

            historyCard.style.display = 'block';

            gamesHistory.forEach((game, index) => {
                let gameDiv = document.createElement('div');
                gameDiv.className = 'history-item';

                let headerDiv = document.createElement('div');
                headerDiv.className = 'history-item-header';

                let title = document.createElement('h4');
                title.textContent = `Game ${index + 1}`;

                let headerRight = document.createElement('div');
                headerRight.style.display = 'flex';
                headerRight.style.alignItems = 'center';
                headerRight.style.gap = '10px';

                let timeSpan = document.createElement('span');
                timeSpan.className = 'history-timestamp';
                timeSpan.textContent = game.timestamp;

                let deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = function() { deleteGame(index); };

                headerRight.appendChild(timeSpan);
                headerRight.appendChild(deleteBtn);

                headerDiv.appendChild(title);
                headerDiv.appendChild(headerRight);
                gameDiv.appendChild(headerDiv);

                let teamsContainer = document.createElement('div');
                teamsContainer.className = 'teams-container';

                let team1Div = document.createElement('div');
                team1Div.className = 'team';
                let t1Heading = document.createElement('h3');
                t1Heading.textContent = 'Team 1';
                let t1Ol = document.createElement('ol');
                game.team1.forEach(name => {
                    let li = document.createElement('li');
                    li.textContent = name;
                    t1Ol.appendChild(li);
                });
                team1Div.appendChild(t1Heading);
                team1Div.appendChild(t1Ol);

                let team2Div = document.createElement('div');
                team2Div.className = 'team';
                let t2Heading = document.createElement('h3');
                t2Heading.textContent = 'Team 2';
                let t2Ol = document.createElement('ol');
                game.team2.forEach(name => {
                    let li = document.createElement('li');
                    li.textContent = name;
                    t2Ol.appendChild(li);
                });
                team2Div.appendChild(t2Heading);
                team2Div.appendChild(t2Ol);

                teamsContainer.appendChild(team1Div);
                teamsContainer.appendChild(team2Div);
                gameDiv.appendChild(teamsContainer);

                historyContainer.appendChild(gameDiv);
            });
        }

        // Initialize state on page load
        const lastRoster = localStorage.getItem('teams_tracker_last_roster') || 'empty';
        document.getElementById('rosterSelect').value = lastRoster;
        switchRoster();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
